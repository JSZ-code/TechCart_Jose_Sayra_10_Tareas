<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="José Sayra Zeballos">
    <title>Nosotros - TechCart</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        @custom-variant dark (&:where([data-theme=dark], [data-theme=dark] *));
        @theme {
            --color-fondo: #f5f5f7;
            --color-superficie: #ffffff;
            --color-texto: #1d1d1f;
            --color-marca: #7c3aed;
        }
        html[data-theme="dark"] {
            --color-fondo: #111114;
            --color-superficie: #1d1d1f;
            --color-texto: #f5f5f7;
            --color-marca: #a78bfa;
        }
    </style>
</head>
<body class="min-h-dvh bg-fondo p-6 text-texto">
    <main class="mx-auto max-w-3xl rounded-2xl bg-superficie p-6">
        <h1 class="text-3xl font-bold text-marca">TechCart</h1>
        <h2 class="mt-5 text-2xl font-bold">Nosotros</h2>
        <p class="mt-3">TechCart es una tienda educativa creada para practicar frontend moderno.</p>
        <figure class="mt-5 overflow-hidden rounded-xl"><img class="w-full" src="img/equipo.svg" alt="Equipo de TechCart colaborando" width="640" height="420"></figure>
        <a class="mt-5 inline-block font-bold text-marca" href="index.html">Volver a la tienda</a>
    </main>
</body>
</html>
